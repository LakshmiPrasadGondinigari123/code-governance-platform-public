services:
  - type: web
    name: code-governance-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /liveness
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /tmp/cgp-data
      - key: SECRET_KEY
        generateValue: true
      - key: EVIDENCE_SIGNING_KEY
        generateValue: true
